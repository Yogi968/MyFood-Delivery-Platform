spring.application.name=food-delivery-api

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/food_delivery_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JWT Configuration
jwt.secret=${JWT_SECRET}

# PayU Test Credentials
payu.merchant-key=${TEST_PAYU_MERCHANT_KEY}
payu.merchant-salt=${TEST_PAYU_MERCHANT_SALT}
payu.payment-url=https://apitest.payu.in/v2/payments
payu.verify-url=https://test.payu.in/v3/transaction

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update

# Frontend Configuration
app.frontend-url=${FRONTEND_URL:http://localhost:4200}

# Logging
logging.level.org.springframework.security=DEBUG
server.port=${PORT:8080}
app.backend-url=${BACKEND_URL:http://localhost:8080}